<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Predictor with History</title>
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: #f4f6f9; color: #333; }
        .container { max-width: 900px; margin: 0 auto; }
        header { background: #1a2a6c; color: white; padding: 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
        @media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .flex-inputs { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
        .bet-row { background: #f8f9fa; padding: 10px; margin: 5px 0; border-left: 4px solid #007bff; display: flex; justify-content: space-between; border-radius: 4px; }
        .bet-row.correct { border-left-color: #28a745; background: #e8f5e9; }
        .bet-row.incorrect { border-left-color: #dc3545; background: #ffebee; }
        .hidden { display: none !important; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button.settle-btn { background: #ffc107; color: #212529; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .leaderboard-table th, .leaderboard-table td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        .leaderboard-table th { background: #f1f3f5; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
        .badge.upcoming { background: #ffeeba; color: #856404; }
        .badge.completed { background: #d4edda; color: #155724; }
        .bet-row.paired { border-left-color: #ff9800; background: #fff8e1; }
        .bet-row.paired.correct { border-left-color: #28a745; background: #e8f5e9; }
        .bet-row.draw { border-left-color: #6c757d; background: #f8f9fa; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h2>🏆 World Cup Prediction Center</h2>
        <div data-netlify-identity-button>Login / Signup</div>
    </header>

    <div id="appContent" class="hidden">
        <div class="grid">
            <div>
                <div class="card">
                    <h3>➕ Add Upcoming Match</h3>
                    <div id="matchCreationPanel">
                        <form id="matchForm">
                            <div class="flex-inputs">
                                <input type="date" id="mDate" required>
                                <input type="text" id="t1" placeholder="Team 1" required>
                                <input type="text" id="t2" placeholder="Team 2" required>
                                <button type="submit">Create Match</button>
                            </div>
                        </form>
                    </div>
                    <p id="matchAccessNotice" class="hidden" style="color:#666; margin:0;">Only admins can add matches and finalize results.</p>
                </div>

                <h3>📅 Match Records & Activity</h3>
                <div id="dashboard"></div>
            </div>

            <div>
                <div class="card">
                    <h3>🥇 Leaderboard</h3>
                    <p style="font-size: 0.9em; color: #666;">Ranked by total correct predicts</p>
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                                <th>Predictor Name</th>
                                <th>Correct</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ⚠️ ASSIGN YOUR JSONBIN.IO KEYS HERE
    const BIN_ID = "6a40cae0da38895dfe0a770e";
    const SECRET_KEY = "$2a$10$wRbjHXSOUsO.HCRv8ihLh.WNsOx41rlOLQTeIs22leYMwWJHHgcDO";
    const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let currentEmail = null;

    netlifyIdentity.on('init', user => handleAuth(user));
    netlifyIdentity.on('login', user => { handleAuth(user); netlifyIdentity.close(); });
    netlifyIdentity.on('logout', () => handleAuth(null));

    function handleAuth(user) {
        if (user) {
            currentEmail = user.email;
            document.getElementById('appContent').classList.remove('hidden');
            fetchData();
        } else {
            currentEmail = null;
            document.getElementById('appContent').classList.add('hidden');
        }
    }

    function getUserRole(email, db) {
        if (!email) return 'user';
        const userEntry = db.users && db.users[email];
        if (userEntry && userEntry.role === 'admin') return 'admin';

        const normalized = String(email).toLowerCase();
        if (normalized.includes('layan') || normalized.includes('yasiru')) return 'admin';

        return 'user';
    }

    function isAdmin(email, db) {
        return getUserRole(email, db) === 'admin';
    }

    function updateAccessControls(role) {
        const isAdminUser = role === 'admin';
        const panel = document.getElementById('matchCreationPanel');
        const notice = document.getElementById('matchAccessNotice');
        if (panel) panel.classList.toggle('hidden', !isAdminUser);
        if (notice) notice.classList.toggle('hidden', isAdminUser);
    }

    async function getDB() {
        const res = await fetch(`${BIN_URL}/latest`, { headers: { "X-Master-Key": SECRET_KEY } });
        const json = await res.json();
        return json.record;
    }

    async function saveDB(newData) {
        await fetch(BIN_URL, {
            method: "PUT",
            headers: { "Content-Type": "application/json", "X-Master-Key": SECRET_KEY },
            body: JSON.stringify(newData)
        });
    }

    async function fetchData() {
        const db = await getDB();
        
        // Account block verification
        if (!db.users) db.users = {};
        if (!(currentEmail in db.users)) {
            db.users[currentEmail] = { is_enabled: true };
            await saveDB(db);
        } else if (db.users[currentEmail].is_enabled === false) {
            alert("Your account has been disabled.");
            netlifyIdentity.logout();
            return;
        }

        const role = getUserRole(currentEmail, db);
        if (!db.users[currentEmail].role) {
            db.users[currentEmail].role = role;
            await saveDB(db);
        }

        updateAccessControls(role);
        calculateLeaderboard(db.matches || []);
        renderMatches(db.matches || [], role);
    }

    function calculateLeaderboard(matches) {
        let scores = {}; // Structure: { "Bettor Name": total_correct }

        matches.forEach(match => {
            if (match.winner && match.winner !== 'Draw') { // Only score non-draw matches that are completed
                match.bets.forEach(bet => {
                    if (!scores[bet.bettor_name]) scores[bet.bettor_name] = 0;

                    const isPaired = isPairedPrediction(match, bet);

                    if (isPaired && bet.picked_side === match.winner) {
                        scores[bet.bettor_name] += 1;
                    }
                });
            } else {
                // Initialize names in leaderboard even if they haven't won points yet
                match.bets.forEach(bet => {
                    if (!scores[bet.bettor_name]) scores[bet.bettor_name] = 0;
                });
            }
        });

        // Convert to array and sort by score descending
        let sortedEntries = Object.entries(scores).sort((a, b) => b[1] - a[1]);
        
        const tbody = document.getElementById('leaderboardBody');
        if (sortedEntries.length === 0) {
            tbody.innerHTML = `<tr><td colspan="2" style="color:#888; text-align:center;">No data available.</td></tr>`;
            return;
        }

        tbody.innerHTML = sortedEntries.map(([name, score]) => `
            <tr>
                <td><b>${escapeHtml(name)}</b></td>
                <td><span style="color:#28a745; font-weight:bold;">🏆 ${score}</span></td>
            </tr>
        `).join('');
    }

    function renderMatches(matches, role = 'user') {
        const container = document.getElementById('dashboard');
        container.innerHTML = '';
        const isAdminUser = role === 'admin';

        matches.forEach(match => {
            const isSettled = !!match.winner;
            
            // Auto-balance choice dropdown
            const t1Count = match.bets.filter(b => b.picked_side === match.team1).length;
            const t2Count = match.bets.filter(b => b.picked_side === match.team2).length;
            const defaultSide = t1Count <= t2Count ? match.team1 : match.team2;

            let betsHtml = match.bets.map(b => {
                const isPaired = isPairedPrediction(match, b);
                let statusClass = isPaired ? 'paired' : '';
                let verificationText = '';

                if (isSettled) {
                    if (match.winner === 'Draw') {
                        statusClass = 'draw';
                        verificationText = ' ↔ Draw';
                    } else if (isPaired && b.picked_side === match.winner) {
                        statusClass = 'paired correct';
                        verificationText = ' ✅ Correct + Paired';
                    } else if (b.picked_side === match.winner) {
                        statusClass = 'incorrect';
                        verificationText = ' ⚠️ Correct team, but not paired';
                    } else {
                        statusClass = 'incorrect';
                        verificationText = ' ❌ Incorrect';
                    }
                } else if (isPaired) {
                    verificationText = ' 🔗 Paired';
                }

                const pairLabel = b.pair_order ? `Pair ${escapeHtml(b.pair_order)}` : 'Paired';
                const pairedBadge = isPaired ? `<span class="badge" style="background:#fff3cd;color:#856404; margin-left:8px;">${pairLabel}</span>` : '';

                return `
                    <div class="bet-row ${statusClass}">
                        <span>🙋‍♂️ <b>${escapeHtml(b.bettor_name)}</b>${pairedBadge}</span>
                        <span>Predict: <b>${escapeHtml(b.picked_side)}</b>${verificationText}</span>
                    </div>
                `;
            }).join('');

            // Build match closing action UI block
            let settleWidget = '';
            if (!isSettled) {
                const predictionWidget = `
                    <div class="flex-inputs">
                        <input type="text" id="name_${match.id}" placeholder="Type Predictor Name..." required>
                        <input type="number" id="order_${match.id}" placeholder="Pair Order" min="1" required>
                        <select id="side_${match.id}">
                            <option value="${escapeHtml(match.team1)}" ${defaultSide === match.team1 ? 'selected' : ''}>${escapeHtml(match.team1)}</option>
                            <option value="${escapeHtml(match.team2)}" ${defaultSide === match.team2 ? 'selected' : ''}>${escapeHtml(match.team2)}</option>
                        </select>
                        <button onclick="submitBet(${match.id})">Save Predict</button>
                    </div>
                `;

                if (isAdminUser) {
                    settleWidget = `
                        <div style="margin-top:15px; background:#f1f3f5; padding:12px; border-radius:6px;">
                            ${predictionWidget}
                            <div style="margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 10px;" class="flex-inputs">
                                <select id="winner_${match.id}">
                                    <option value="Draw">Draw</option>
                                    <option value="${escapeHtml(match.team1)}">${escapeHtml(match.team1)}</option>
                                    <option value="${escapeHtml(match.team2)}">${escapeHtml(match.team2)}</option>
                                </select>
                                <button class="settle-btn" onclick="settleMatch(${match.id})">🔒 Set Final Match Result</button>
                            </div>
                        </div>
                    `;
                } else {
                    settleWidget = `
                        <div style="margin-top:15px; background:#f1f3f5; padding:12px; border-radius:6px;">
                            ${predictionWidget}
                            <p style="margin-top:10px; color:#666;">Only admins can finalize match results.</p>
                        </div>
                    `;
                }
            } else {
                settleWidget = `
                    <p style="margin-top:10px; color:#28a745; font-weight:bold;">🌟 Winner Confirmed: ${escapeHtml(match.winner)}</p>
                `;
            }

            container.innerHTML += `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3>📅 ${match.date} — ${escapeHtml(match.team1)} vs ${escapeHtml(match.team2)}</h3>
                        <span class="badge ${isSettled ? 'completed' : 'upcoming'}">${isSettled ? 'Finished' : 'Upcoming'}</span>
                    </div>
                    <div>${betsHtml || '<p style="color:#888; font-style:italic;">No logged predicts yet.</p>'}</div>
                    ${settleWidget}
                </div>
            `;
        });
    }

    async function submitBet(matchId) {
        const name = document.getElementById(`name_${matchId}`).value;
        const order = document.getElementById(`order_${matchId}`).value;
        const side = document.getElementById(`side_${matchId}`).value;
        if(!name) return alert("Please specify a name.");
        if(!order) return alert("Please enter a pair order.");

        const db = await getDB();
        const match = db.matches.find(m => m.id === matchId);
        if (match) {
            match.bets.push({ bettor_name: name, picked_side: side, pair_order: order });
            await saveDB(db);
            fetchData();
        }
    }

    async function settleMatch(matchId) {
        const winningTeam = document.getElementById(`winner_${matchId}`).value;
        if(!confirm(`Are you sure ${winningTeam} won? This will lock the match and calculate user scores.`)) return;

        const db = await getDB();
        if (!isAdmin(currentEmail, db)) {
            alert("Only admins can finalize match results.");
            return;
        }

        const match = db.matches.find(m => m.id === matchId);
        if (match) {
            match.winner = winningTeam;
            await saveDB(db);
            fetchData();
        }
    }

    document.getElementById('matchForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const db = await getDB();
        if (!isAdmin(currentEmail, db)) {
            alert("Only admins can add matches.");
            return;
        }
        if(!db.matches) db.matches = [];

        db.matches.push({
            id: Date.now(),
            date: document.getElementById('mDate').value,
            team1: document.getElementById('t1').value,
            team2: document.getElementById('t2').value,
            bets: []
        });

        await saveDB(db);
        document.getElementById('matchForm').reset();
        fetchData();
    });

    function isPairedPrediction(match, bet) {
        const pairOrder = String(bet.pair_order || '').trim();
        if (!pairOrder) return false;

        const matchingOrderCount = (match.bets || []).filter(other => {
            const otherPairOrder = String(other.pair_order || '').trim();
            return otherPairOrder === pairOrder;
        }).length;

        return matchingOrderCount > 1;
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>
</body>
</html>
